x-image: &image
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: tunnel-lidar-ros2:humble

x-ros: &ros
  <<: *image
  init: true
  network_mode: host
  ipc: host
  environment:
    - DISPLAY=${DISPLAY}
    - QT_X11_NO_MITSHM=1
    - PYTHONDONTWRITEBYTECODE=1
    - ROS_DOMAIN_ID
    - XAUTHORITY=/tmp/.Xauthority
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=all
    - BAG
    - LAUNCH_ARGS
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ${XAUTHORITY:-/dev/null}:/tmp/.Xauthority:ro
    - "./ROS2 folder/src:/workspace/ros2_ws/src"
    - ./data:/workspace/data
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  depends_on:
    network-setup:
      condition: service_completed_successfully

services:
  network-setup:
    <<: *image
    network_mode: host
    privileged: true
    entrypoint: ["sh", "-c", "sysctl -q -w net.core.rmem_max=67108864 || true"]

  detector:
    <<: *ros
    command: bash -c 'exec ros2 launch bringup detector.launch.py $${BAG:+bag:=$$BAG} $$LAUNCH_ARGS'

  rviz:
    <<: *ros
    command: ros2 launch bringup rviz.launch.py

  demo:
    <<: *ros
    command: bash -c 'exec ros2 launch bringup demo.launch.py $${BAG:+bag:=$$BAG} $$LAUNCH_ARGS'

  ros2:
    <<: *ros
    stdin_open: true
    tty: true
