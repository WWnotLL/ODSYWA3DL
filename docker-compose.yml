x-ros: &ros
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: tunnel-lidar-ros2:humble
  init: true
  network_mode: host
  ipc: host
  environment:
    - DISPLAY=${DISPLAY}
    - QT_X11_NO_MITSHM=1
    - PYTHONDONTWRITEBYTECODE=1
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=all
    - BAG
    - LAUNCH_ARGS
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - "./ROS2 folder/src:/workspace/ros2_ws/src"
    - ./data:/workspace/data
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  detector:
    <<: *ros
    command: bash -c 'exec ros2 launch bringup detector.launch.py $${BAG:+bag:=$$BAG} $$LAUNCH_ARGS'

  rviz:
    <<: *ros
    command: ros2 launch bringup rviz.launch.py

  demo:
    <<: *ros
    command: bash -c 'exec ros2 launch bringup demo.launch.py $${BAG:+bag:=$$BAG} $$LAUNCH_ARGS'

  ros2:
    <<: *ros
    stdin_open: true
    tty: true
