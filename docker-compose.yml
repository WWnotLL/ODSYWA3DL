services:
  ros2:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: tunnel-lidar-ros2:humble
    container_name: tunnel_lidar_ros2
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - "./ROS2 folder:/workspace/ros2_ws"
      - ./data:/workspace/data
    working_dir: /workspace/ros2_ws
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
